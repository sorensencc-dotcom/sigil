title = "sigil gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "known false positives: disposable CI/local-only postgres credentials"
regexes = [
  '''sigil:sigil_password@(localhost|127\.0\.0\.1)''',
]
paths = [
  '''\.github/workflows/ci\.yml''',
  '''\.github/workflows/release\.yml''',
  '''docs/wiki/README\.md''',
]
