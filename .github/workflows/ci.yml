name: Sigil CI & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    name: Linux - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigil
          POSTGRES_PASSWORD: sigil_password
          POSTGRES_DB: sigil
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JCS Conformance Audit
        run: npm run audit:jcs

      - name: Run Unit & Contract Tests
        run: npm test

      - name: Run Live PostgreSQL Gate
        env:
          SIGIL_TEST_DATABASE_URL: postgres://sigil:sigil_password@localhost:55432/sigil
        run: npm run test:live

  test-windows:
    name: Windows - Node ${{ matrix.node-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JCS Conformance Audit
        run: npm run audit:jcs

      - name: Run Unit & Contract Tests
        run: npm test
