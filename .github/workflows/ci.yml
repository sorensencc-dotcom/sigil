name: Sigil CI & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  test-linux:
    name: Linux - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigil
          POSTGRES_PASSWORD: sigil_password
          POSTGRES_DB: sigil_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JCS Conformance Audit
        run: npm run audit:jcs

      - name: Run Unit & Contract Tests
        run: npm test

      # sigil/integration/oauth-login.e2e.test.mjs serves the built web client; without dist/ it times out.
      - name: Build web client for the live gate
        run: npm --prefix packages/sigil-rooms-web ci && npm --prefix packages/sigil-rooms-web run build

      - name: Run Live PostgreSQL Gate
        env:
          SIGIL_TEST_DATABASE_URL: postgres://sigil:sigil_password@localhost:55432/sigil_test
        run: npm run test:live

  test-windows:
    name: Windows - Node ${{ matrix.node-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run JCS Conformance Audit
        run: npm run audit:jcs

      - name: Run Unit & Contract Tests
        run: npm test

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sigil-rooms-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: packages/sigil-rooms-web/package-lock.json

      - name: Install core dependencies
        run: npm ci --ignore-scripts
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        run: npm run test:e2e

  # Reproduces the relay-jobs schedule exploration (#202) so someone other than the
  # original runner can see the per-scenario counts. check.mjs exits 1 on a new
  # failure and 2 when a known finding stops failing.
  relay-jobs-verification:
    name: Relay jobs schedule checker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install core dependencies
        run: npm ci --ignore-scripts

      - name: Install checker dependencies
        run: npm ci --prefix packages/relay-jobs-verification

      - name: Explore schedules
        shell: bash
        run: |
          node packages/relay-jobs-verification/check.mjs | tee relay-jobs-check.txt
          {
            echo '### Relay jobs schedule checker'
            echo '```'
            cat relay-jobs-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checker output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-jobs-check
          path: relay-jobs-check.txt
          if-no-files-found: ignore
