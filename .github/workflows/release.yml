name: Publish Release to npm

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Installs dependencies, runs the gates, and packs the tarball. It has no
  # id-token permission, so code run here (including dependency lifecycle
  # scripts) cannot mint the OIDC token that npm trusted publishing accepts.
  build:
    name: Build, Verify, and Pack
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigil
          POSTGRES_PASSWORD: sigil_password
          POSTGRES_DB: sigil
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency and JCS audits
        run: |
          npm run audit:deps
          npm run audit:jcs

      - name: Run unit & contract tests
        run: npm test

      - name: Run live PostgreSQL gate
        env:
          SIGIL_TEST_DATABASE_URL: postgres://sigil:sigil_password@localhost:55432/sigil
        run: npm run test:live

      - name: Verify package bundle
        run: npm run pack:check

      - name: Pack release tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Publishes the tarball built above. It checks out no code and installs no
  # dependencies, and publishing a tarball runs no package lifecycle scripts,
  # so only npm itself runs while the OIDC token is available.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm CLI 11.5.1 or later; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Download release tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist

      # Authenticates through npm trusted publishing. No NPM_TOKEN secret is read.
      # Requires this repo and release.yml to be registered as a trusted publisher
      # for @sorensencc/sigil on npmjs.com.
      - name: Publish scoped package to npm
        run: npm publish dist/*.tgz --provenance --access public
