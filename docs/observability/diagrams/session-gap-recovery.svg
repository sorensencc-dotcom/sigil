<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700"><rect width="1300" height="700" fill="#f2ece2"/><text x="48" y="60" fill="#5c5349" font-family="monospace" font-size="14" letter-spacing="2">SIGIL / CONNECTOR RECOVERY</text><text x="48" y="110" fill="#2c2420" font-family="Georgia,serif" font-size="38" font-weight="600">Detect, request, and release a stream gap</text><text x="48" y="145" fill="#5c5349" font-family="Arial,sans-serif" font-size="20">Each stream tracks high-water state independently; NULL preserves queued-order behavior.</text><g font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><rect x="48" y="230" width="170" height="90" rx="12" fill="#fffaf2" stroke="#2c2420" stroke-width="3"/><text x="133" y="270" fill="#2c2420"><tspan x="133">Incoming</tspan><tspan x="133" dy="25">envelope</tspan></text><text x="245" y="285" fill="#c4501a" font-size="30">→</text><rect x="265" y="230" width="190" height="90" rx="12" fill="#ded5c8" stroke="#2c2420" stroke-width="3"/><text x="360" y="270" fill="#2c2420"><tspan x="360">NULL → queued</tspan><tspan x="360" dy="25">order fallback</tspan></text><rect x="485" y="230" width="190" height="90" rx="12" fill="#fffaf2" stroke="#2c2420" stroke-width="3"/><text x="580" y="270" fill="#2c2420"><tspan x="580">Next → advance</tspan><tspan x="580" dy="25">high-water</tspan></text><rect x="705" y="230" width="190" height="90" rx="12" fill="#c4501a" stroke="#c4501a" stroke-width="3"/><text x="800" y="270" fill="#f2ece2"><tspan x="800">Future → buffer</tspan><tspan x="800" dy="25">bounded gap</tspan></text><text x="925" y="285" fill="#c4501a" font-size="30">→</text><rect x="945" y="230" width="250" height="90" rx="12" fill="#c4501a" stroke="#c4501a" stroke-width="3"/><text x="1070" y="270" fill="#f2ece2"><tspan x="1070">Debounced resend</tspan><tspan x="1070" dy="25">request</tspan></text><rect x="180" y="450" width="240" height="90" rx="12" fill="#fffaf2" stroke="#2c2420" stroke-width="3"/><text x="300" y="490" fill="#2c2420"><tspan x="300">Frames restore</tspan><tspan x="300" dy="25">high-water</tspan></text><rect x="530" y="450" width="240" height="90" rx="12" fill="#ded5c8" stroke="#2c2420" stroke-width="3"/><text x="650" y="490" fill="#2c2420"><tspan x="650">Reset releases</tspan><tspan x="650" dy="25">through gap</tspan></text><rect x="880" y="450" width="240" height="90" rx="12" fill="#ded5c8" stroke="#2c2420" stroke-width="3"/><text x="1000" y="490" fill="#2c2420"><tspan x="1000">Exhaustion emits</tspan><tspan x="1000" dy="25">unrecoverable_gap</tspan></text></g><path d="M1070 320v70H300v60M1070 320v70H650v60M1070 320v70h350v60" fill="none" stroke="#c4501a" stroke-width="3"/></svg>
