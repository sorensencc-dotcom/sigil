<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigil · Delivery lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Barlow+Condensed:wght@300;400;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2ece2;
      --color-ink:     #2c2420;
      --color-muted:   #5c5349;
      --color-accent:  #c4501a;
      --font-sans:     'Barlow Condensed', system-ui, sans-serif;
      --font-serif:    'Playfair Display', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Diagram Design</p>
    <h1>Delivery lifecycle</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delivery-lifecycle-title delivery-lifecycle-desc">
      <title id="delivery-lifecycle-title">Delivery lifecycle</title>
      <desc id="delivery-lifecycle-desc">State machine showing an envelope moving from queued through delivery, acknowledgement, and processing to success, with rejection and retry-then-dead-letter branches off the happy path.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5c5349"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c4501a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2ece2"/>

      <!-- ============ ZONES ============ -->
      <rect x="164" y="32" width="932" height="496" rx="8" fill="rgba(44,36,32,0.02)" stroke="rgba(44,36,32,0.10)" stroke-width="0.8"/>
      <rect x="196" y="36" width="72" height="12" rx="2" fill="#f2ece2"/>
      <text x="232" y="45" fill="rgba(44,36,32,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">IN FLIGHT</text>

      <rect x="544" y="544" width="552" height="112" rx="8" fill="rgba(44,36,32,0.02)" stroke="rgba(44,36,32,0.10)" stroke-width="0.8"/>
      <rect x="782" y="548" width="72" height="12" rx="2" fill="#f2ece2"/>
      <text x="818" y="557" fill="rgba(44,36,32,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TERMINAL</text>

      <!-- ============ ARROWS ============ -->

      <!-- Spine (straight, same column) -->
      <line x1="640" y1="22" x2="640" y2="64" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="128" x2="640" y2="192" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="256" x2="640" y2="320" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="384" x2="640" y2="448" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="512" x2="640" y2="576" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="640" x2="640" y2="672" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Rejection branch: queued/delivered/acknowledged -> delivery_rejected -->
      <path d="M560,96 Q560,256 220,256" fill="none" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M560,224 Q260,224 260,256" fill="none" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M560,352 Q560,256 300,256" fill="none" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Retry branch: acknowledged -> processing_failed, processing <-> processing_failed -->
      <path d="M720,352 Q960,352 960,448" fill="none" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="720" y1="480" x2="920" y2="480" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M960,512 Q640,528 600,512" fill="none" stroke="#5c5349" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="1000" y1="512" x2="1000" y2="576" stroke="#c4501a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Terminals -> shared end -->
      <path d="M260,320 V656 Q260,680 268,680 H632" fill="none" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M1000,640 V664 Q1000,680 992,680 H648" fill="none" stroke="#5c5349" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ EDGE LABELS ============ -->
      <rect x="600" y="30" width="56" height="12" rx="2" fill="#f2ece2"/>
      <text x="628" y="39" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACCEPTED</text>

      <rect x="612" y="150" width="56" height="12" rx="2" fill="#f2ece2"/>
      <text x="640" y="159" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELIVERED</text>

      <rect x="612" y="278" width="40" height="12" rx="2" fill="#f2ece2"/>
      <text x="632" y="287" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACKED</text>

      <rect x="596" y="406" width="88" height="12" rx="2" fill="#f2ece2"/>
      <text x="640" y="415" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROCESSING</text>

      <rect x="620" y="534" width="40" height="12" rx="2" fill="#f2ece2"/>
      <text x="640" y="543" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DONE</text>

      <rect x="410" y="150" width="52" height="12" rx="2" fill="#f2ece2"/>
      <text x="436" y="159" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REJECTED</text>

      <rect x="330" y="218" width="52" height="12" rx="2" fill="#f2ece2"/>
      <text x="356" y="227" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REJECTED</text>

      <rect x="410" y="278" width="52" height="12" rx="2" fill="#f2ece2"/>
      <text x="436" y="287" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REJECTED</text>

      <rect x="792" y="346" width="40" height="12" rx="2" fill="#f2ece2"/>
      <text x="812" y="355" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILED</text>

      <rect x="798" y="474" width="40" height="12" rx="2" fill="#f2ece2"/>
      <text x="818" y="483" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILED</text>

      <rect x="692" y="498" width="36" height="12" rx="2" fill="#f2ece2"/>
      <text x="710" y="507" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY</text>

      <rect x="972" y="534" width="56" height="12" rx="2" fill="#f2ece2"/>
      <text x="1000" y="543" fill="#c4501a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXHAUSTED</text>

      <!-- ============ NODES ============ -->

      <!-- start pseudostate -->
      <circle cx="640" cy="16" r="6" fill="#2c2420"/>

      <!-- queued -->
      <rect x="560" y="64" width="160" height="64" rx="8" fill="#f2ece2"/>
      <rect x="560" y="64" width="160" height="64" rx="8" fill="#faf6f0" stroke="#2c2420" stroke-width="1"/>
      <rect x="568" y="72" width="20" height="12" rx="2" fill="transparent" stroke="rgba(44,36,32,0.40)" stroke-width="0.8"/>
      <text x="578" y="81" fill="#2c2420" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Q</text>
      <text x="640" y="100" fill="#2c2420" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">queued</text>

      <!-- delivered -->
      <rect x="560" y="192" width="160" height="64" rx="8" fill="#f2ece2"/>
      <rect x="560" y="192" width="160" height="64" rx="8" fill="#faf6f0" stroke="#2c2420" stroke-width="1"/>
      <rect x="568" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(44,36,32,0.40)" stroke-width="0.8"/>
      <text x="582" y="209" fill="#2c2420" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DLV</text>
      <text x="640" y="228" fill="#2c2420" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">delivered</text>

      <!-- acknowledged -->
      <rect x="560" y="320" width="160" height="64" rx="8" fill="#f2ece2"/>
      <rect x="560" y="320" width="160" height="64" rx="8" fill="#faf6f0" stroke="#2c2420" stroke-width="1"/>
      <rect x="568" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(44,36,32,0.40)" stroke-width="0.8"/>
      <text x="582" y="337" fill="#2c2420" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACK</text>
      <text x="640" y="356" fill="#2c2420" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">acknowledged</text>

      <!-- processing -->
      <rect x="560" y="448" width="160" height="64" rx="8" fill="#f2ece2"/>
      <rect x="560" y="448" width="160" height="64" rx="8" fill="#faf6f0" stroke="#2c2420" stroke-width="1"/>
      <rect x="568" y="456" width="24" height="12" rx="2" fill="transparent" stroke="rgba(44,36,32,0.40)" stroke-width="0.8"/>
      <text x="580" y="465" fill="#2c2420" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
      <text x="640" y="484" fill="#2c2420" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">processing</text>

      <!-- processed -->
      <rect x="560" y="576" width="160" height="64" rx="8" fill="#f2ece2"/>
      <rect x="560" y="576" width="160" height="64" rx="8" fill="#faf6f0" stroke="#2c2420" stroke-width="1"/>
      <rect x="568" y="584" width="32" height="12" rx="2" fill="transparent" stroke="rgba(44,36,32,0.40)" stroke-width="0.8"/>
      <text x="584" y="593" fill="#2c2420" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DONE</text>
      <text x="640" y="612" fill="#2c2420" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">processed</text>

      <!-- delivery_rejected -->
      <rect x="180" y="256" width="160" height="64" rx="8" fill="#f2ece2"/>
      <rect x="180" y="256" width="160" height="64" rx="8" fill="rgba(44,36,32,0.05)" stroke="#5c5349" stroke-width="1"/>
      <rect x="188" y="264" width="24" height="12" rx="2" fill="transparent" stroke="rgba(92,83,73,0.50)" stroke-width="0.8"/>
      <text x="200" y="273" fill="#5c5349" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REJ</text>
      <text x="260" y="292" fill="#2c2420" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">delivery_rejected</text>

      <!-- processing_failed -->
      <rect x="920" y="448" width="160" height="64" rx="8" fill="#f2ece2"/>
      <rect x="920" y="448" width="160" height="64" rx="8" fill="rgba(44,36,32,0.02)" stroke="rgba(44,36,32,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="928" y="456" width="20" height="12" rx="2" fill="transparent" stroke="rgba(44,36,32,0.40)" stroke-width="0.8"/>
      <text x="938" y="465" fill="#5c5349" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RTY</text>
      <text x="1000" y="484" fill="#2c2420" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">processing_failed</text>

      <!-- dead_letter (FOCAL) -->
      <rect x="920" y="576" width="160" height="64" rx="8" fill="#f2ece2"/>
      <rect x="920" y="576" width="160" height="64" rx="8" fill="rgba(196,80,26,0.08)" stroke="#c4501a" stroke-width="1"/>
      <rect x="928" y="584" width="28" height="12" rx="2" fill="transparent" stroke="rgba(196,80,26,0.50)" stroke-width="0.8"/>
      <text x="942" y="593" fill="#c4501a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DLQ</text>
      <text x="1000" y="612" fill="#2c2420" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">dead_letter</text>

      <!-- end pseudostate (ringed dot) -->
      <circle cx="640" cy="680" r="8" fill="none" stroke="#2c2420" stroke-width="1"/>
      <circle cx="640" cy="680" r="5" fill="#2c2420"/>
    </svg>
  </div>
</body>
</html>
